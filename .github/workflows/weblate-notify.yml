name: Weblate Notification

on:
    push:
        branches:
            - 'translation'

permissions:
    contents: read

jobs:
    notify:
        runs-on: ubuntu-latest
        if: |
            contains(github.actor, 'weblate') ||
            contains(github.event.head_commit.committer.email, 'weblate') ||
            contains(github.event.head_commit.author.email, 'weblate')
        steps:
            - name: Send Discord Alert
              uses: ELowry/weblate-action-notifier@main
              with:
                  webhook_url: ${{ secrets.DISCORD_WEBLATE_WEBHOOK }}
